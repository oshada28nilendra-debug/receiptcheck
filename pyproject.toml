[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "receipt-review"
version = "0.1.0"
description = "Local receipt OCR with evidence and review flags"
requires-python = ">=3.10"
dependencies = ["Pillow>=11,<14"]

[project.scripts]
receipt-review = "receipt_review.cli:main"

[tool.setuptools.packages.find]
include = ["receipt_review*"]
